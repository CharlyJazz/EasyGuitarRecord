<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Transferencias</title>
  <style>
    :root { color-scheme: dark; }
    html, body { margin: 0; background: #0b0b0b; color: #e9e9e9;
                 font: 15px -apple-system, system-ui, sans-serif; }
    * { box-sizing: border-box; }
    body { padding: 0 calc(16px + env(safe-area-inset-left))
                   calc(28px + env(safe-area-inset-bottom)); max-width: 820px; margin: 0 auto; }

    /* Se puede llegar aca por un enlace o escribiendo la URL, asi que la
       vuelta no puede depender del boton atras del navegador. Van las dos
       porque la misma pagina la abren la PC y el telefono. */
    .volver { display: flex; gap: 8px; margin: 18px 0 0; }
    .volver a { color: #b9b9b9; text-decoration: none; font-size: 13px;
                padding: 6px 12px; border-radius: 999px;
                background: #1a1a1a; border: 1px solid #2e2e2e; }

    h1 { font-size: 19px; margin: 14px 0 4px; }
    .sub { color: #8a8a8a; font-size: 13px; margin: 0 0 18px; line-height: 1.5; }
    .sub code { color: #b9b9b9; }

    h2 { font-size: 13px; text-transform: uppercase; letter-spacing: .06em;
         color: #8a8a8a; margin: 26px 0 10px; font-weight: 600; }

    /* Botones grandes: en el telefono se tocan con el pulgar. */
    .acciones { display: flex; gap: 10px; flex-wrap: wrap; }
    .boton { flex: 1 1 140px; min-width: 0; font: inherit; font-weight: 600;
             color: #fff; background: #1e6fd9; border: 0; border-radius: 10px;
             padding: 15px 16px; text-align: center; cursor: pointer; }
    .boton:active { background: #1a5fba; }
    .boton.secundario { background: #232323; border: 1px solid #383838; color: #e9e9e9; }
    .boton.secundario:active { background: #2e2e2e; }
    input[type=file] { display: none; }

    #soltar { margin-top: 12px; border: 1px dashed #3a3a3a; border-radius: 10px;
              padding: 16px; text-align: center; color: #7a7a7a; font-size: 13px; }
    #soltar.encima { border-color: #1e6fd9; color: #cfe3ff; background: #131c28; }

    .tarjeta { background: #141414; border: 1px solid #242424; border-radius: 10px;
               padding: 12px 14px; margin-bottom: 8px; }
    .fila { display: flex; align-items: center; gap: 12px; }
    /* min-width:0 en los dos niveles: por defecto un item de flex no baja de
       su contenido, y un nombre largo empujaba los botones fuera de pantalla
       en vez de recortarse. */
    .fila > div:first-child { min-width: 0; }
    .nombre { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis;
              white-space: nowrap; }
    .chico { flex: none; }
    .meta { color: #8a8a8a; font-size: 12px; margin-top: 3px; }
    .meta.malo { color: #ff8080; }
    .meta.bueno { color: #6bd48a; }

    .barra { height: 6px; background: #262626; border-radius: 3px; overflow: hidden;
             margin-top: 9px; }
    .barra > i { display: block; height: 100%; width: 0; background: #1e6fd9;
                 transition: width .15s linear; }
    .tarjeta.listo .barra > i { background: #2f9e52; }
    .tarjeta.error .barra > i { background: #b33; }

    .chico { font: inherit; font-size: 13px; color: #cfcfcf; background: #232323;
             border: 1px solid #383838; border-radius: 7px; padding: 8px 13px;
             cursor: pointer; text-decoration: none; display: inline-block; }
    .chico:active { background: #2e2e2e; }
    .chico.borrar { color: #e08a8a; }

    #lista:empty::after { content: "No hay nada todavia."; color: #6a6a6a; font-size: 13px; }
    #vacioCola { color: #6a6a6a; font-size: 13px; }
  </style>
</head>
<body>
  <nav class="volver">
    <a href="monitor.html">Monitor (PC)</a>
    <a href="phone.html">Camara (telefono)</a>
  </nav>

  <h1>Transferencias</h1>
  <p class="sub">
    Carpeta compartida entre el telefono y esta PC, por la red local. Los bytes van
    directo de un aparato al otro: nada se recomprime y nada sale a internet.
  </p>

  <div class="acciones">
    <button class="boton" id="btnMedia">Fotos y videos</button>
    <button class="boton secundario" id="btnArchivos">Otros archivos</button>
  </div>
  <input type="file" id="inputMedia" accept="video/*,image/*" multiple>
  <input type="file" id="inputArchivos" multiple>
  <div id="soltar">o arrastra archivos aca (en la PC)</div>

  <h2>Subiendo</h2>
  <div id="cola"><span id="vacioCola">Nada en curso.</span></div>

  <h2>En la carpeta</h2>
  <div id="lista"></div>

  <script type="module" src="transferir.js"></script>
</body>
</html>

<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <title>iPhone Monitor</title>
  <style>
    html, body { margin: 0; height: 100%; background: #000; color: #fff;
                 font: 14px system-ui, sans-serif; overflow: hidden; }
    /* El video deja lugar a la galeria, en vez de quedar tapado por ella. */
    #remote { width: calc(100vw - var(--galeria)); height: calc(100vh - var(--cabecera));
              object-fit: contain; display: block;
              margin-left: var(--galeria); margin-top: var(--cabecera); }

    :root { --galeria: 250px; --cabecera: 48px; }
    body.sinGaleria { --galeria: 0px; }
    body.sinCabecera { --cabecera: 0px; }

    #cabecera { position: fixed; top: 0; left: var(--galeria); right: 0;
                height: var(--cabecera); box-sizing: border-box;
                display: flex; align-items: center; gap: 8px; padding: 0 12px;
                background: #0d0d0d; border-bottom: 1px solid #262626; }
    body.sinCabecera #cabecera { display: none; }

    #cabecera button { font: inherit; color: #e9e9e9; background: #1e1e1e;
                       border: 1px solid #343434; border-radius: 6px;
                       padding: 7px 13px; cursor: pointer; }
    #cabecera button:hover:not(:disabled) { background: #2b2b2b; border-color: #555; }
    #cabecera button:disabled { opacity: .35; cursor: default; }
    #cabecera button.principal { background: #b32424; border-color: #d33; font-weight: 600; }
    #cabecera button.principal:hover:not(:disabled) { background: #cc2a2a; }
    #cabecera button.guardar { background: #1a6b38; border-color: #2a8a4c; }
    #cabecera button.guardar:hover:not(:disabled) { background: #218244; }
    #cabecera .separador { flex: 1; }
    #cabecera .atajo { color: #7a7a7a; font-size: 12px; }

    #galeria { position: fixed; top: 0; left: 0; bottom: 0; width: 250px;
               background: #0d0d0d; border-right: 1px solid #262626;
               display: flex; flex-direction: column; }
    body.sinGaleria #galeria { display: none; }

    #galeriaTitulo { padding: 11px 14px; border-bottom: 1px solid #262626;
                     font-weight: 600; display: flex; justify-content: space-between;
                     gap: 8px; }
    #galeriaTitulo span { color: #8a8a8a; font-weight: 400; }

    #galeriaGrid { flex: 1; overflow-y: auto; padding: 10px;
                   display: grid; grid-template-columns: 1fr 1fr; gap: 10px;
                   align-content: start; }

    .toma { cursor: pointer; background: #171717; border: 1px solid #262626;
            border-radius: 6px; overflow: hidden; }
    .toma:hover { border-color: #6b6b6b; }
    .toma video { width: 100%; aspect-ratio: 1; object-fit: cover; display: block;
                  background: #000; pointer-events: none; }
    .toma .pie { padding: 5px 6px; font-size: 11px; line-height: 1.35; }
    .toma .pie b { display: block; font-weight: 600; }
    .toma .acciones { display: flex; border-top: 1px solid #262626; }
    .toma .acciones > * { flex: 1; font: inherit; font-size: 12px; text-align: center;
                          color: #b9b9b9; background: transparent; border: 0;
                          padding: 6px 0; cursor: pointer; text-decoration: none; }
    .toma .acciones > * + * { border-left: 1px solid #262626; }
    .toma .acciones > *:hover { background: #242424; color: #fff; }
    .toma .acciones .borrar:hover { background: #5a1a1a; }
    .toma .pie span { color: #8a8a8a; }

    #galeriaVacia { grid-column: 1 / -1; color: #7a7a7a; padding: 10px 4px;
                    line-height: 1.5; }

    #estado { position: fixed; top: var(--cabecera); left: var(--galeria); padding: 10px 14px;
              background: rgba(0,0,0,.6); }
    #estado.error { background: rgba(150,20,20,.9); }
    #estado.oculto { opacity: 0; transition: opacity .6s; }

    #stats { position: fixed; top: var(--cabecera); right: 0; padding: 10px 14px;
             background: rgba(0,0,0,.7); font: 12px ui-monospace, Consolas, monospace;
             white-space: pre; line-height: 1.5; }
    #stats.oculto { display: none; }

    /* Grabando: se tiene que ver de un vistazo desde lejos, con la guitarra
       en la mano y sin poder acercarse a leer. */
    #rec { position: fixed; top: calc(var(--cabecera) + 14px); left: 50%; transform: translateX(-50%);
           display: none; align-items: center; gap: 10px;
           padding: 8px 18px; border-radius: 999px;
           background: rgba(200,30,30,.92); font-size: 17px; font-weight: 600; }
    #rec.activo { display: flex; }
    #punto { width: 13px; height: 13px; border-radius: 50%; background: #fff;
             animation: latir 1s infinite; }
    @keyframes latir { 50% { opacity: .15; } }

    #aviso { position: fixed; top: calc(var(--cabecera) + 60px); left: 50%; transform: translateX(-50%);
             padding: 8px 18px; border-radius: 8px; background: rgba(0,0,0,.8);
             font-size: 16px; opacity: 0; transition: opacity .3s; }
    #aviso.visible { opacity: 1; }
    #aviso.bueno { background: rgba(25,120,50,.92); }
    #aviso.malo { background: rgba(150,20,20,.92); }

    /* Ultimo recurso si el navegador igual se niega a reproducir solo. */
    #tocarParaVer { position: fixed; inset: 0; display: none;
                    align-items: center; justify-content: center;
                    background: rgba(0,0,0,.75); font-size: 22px; cursor: pointer; }
    #tocarParaVer.visible { display: flex; }

    #gestos { position: fixed; left: var(--galeria); bottom: 0; padding: 10px 14px;
              background: rgba(0,0,0,.6); min-width: 230px; }
    #gestos .barra { height: 4px; margin-top: 7px; background: rgba(255,255,255,.2); }
    #gestos .relleno { height: 100%; width: 0; background: #fff; transition: width .08s linear; }

    #ayuda { position: fixed; right: 0; bottom: 0; padding: 10px 14px;
             background: rgba(0,0,0,.6); text-align: right; line-height: 1.7; }
    #ayuda b { font-weight: 600; }
  </style>
</head>
<body>
  <!-- muted no es opcional: Chrome bloquea el autoplay de un video que no
       este silenciado si no hubo interaccion con la pagina, y el stream se
       queda en pausa mostrando negro. No hay audio que perder: el telefono
       captura con audio:false. -->
  <video id="remote" autoplay playsinline muted></video>

  <aside id="galeria">
    <div id="galeriaTitulo">Tomas <span id="galeriaCuenta"></span></div>
    <div id="galeriaGrid"></div>
  </aside>

  <header id="cabecera">
    <button id="btnGrabar" class="principal" title="Palma abierta">● Grabar</button>
    <button id="btnGuardar" class="guardar" title="Pulgar arriba">✓ Guardar</button>
    <button id="btnDescartar" title="Pulgar abajo">✕ Descartar</button>
    <span class="separador"></span>
    <button id="btnGaleria" title="Tecla V">Galeria</button>
    <button id="btnStats" title="Tecla S">Estadisticas</button>
    <button id="btnPantalla" title="Tecla F">Pantalla completa</button>
  </header>

  <div id="estado">Esperando al iPhone...</div>
  <div id="stats" class="oculto"></div>

  <div id="rec"><span id="punto"></span><span id="reloj">0:00</span></div>
  <div id="aviso"></div>
  <div id="tocarParaVer">Hacé clic para ver el video</div>

  <div id="gestos">
    <div id="gestoTexto">Gestos: cargando modelo...</div>
    <div class="barra"><div class="relleno" id="gestoBarra"></div></div>
  </div>

  <div id="ayuda">
    <b>palma abierta</b> · empezar / reiniciar toma<br>
    <b>pulgar arriba</b> · guardar<br>
    <b>pulgar abajo</b> · descartar<br>
    <b>R</b> grabar · <b>G</b> guardar · <b>D</b> descartar<br>
    <b>S</b> estadisticas · <b>F</b> pantalla · <b>V</b> galeria · <b>H</b> barra
  </div>

  <script type="module" src="monitor.js"></script>
</body>
</html>

  <rect x="757" y="263" width="74" height="240" fill="#12181C"/>
  <text x="794" y="284" text-anchor="middle" font-family="'Segoe UI', system-ui, sans-serif" font-weight="800" font-size="12" fill="#9BE3B4">TOMAS</text>

    <path d="M40,-78 q54,10 76,-28" fill="none" stroke="#E4573D" stroke-width="21" stroke-linecap="round"/>
    <circle cx="120" cy="-110" r="15" fill="#FFD9A8" stroke="#14110F" stroke-width="5"/>
    <path d="M-44,-72 q-24,56 22,70" fill="none" stroke="#14110F" stroke-width="32" stroke-linecap="round"/>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 800" width="1200" height="800" role="img" aria-label="iPhone Camera Monitor: el telefono filma y manda el video por WebRTC a la PC, que hace de monitor; los gestos de mano guardan o descartan la toma">
<defs>
